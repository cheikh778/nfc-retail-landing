name: Deploy API

# Ships server/ to the Hostinger Node.js app over SSH, then restarts Passenger.
# Runs only when server code changes AND the repo variable DEPLOY_API_ENABLED
# is "true" (set it once everything below is configured — see deploy/DEPLOYMENT.md).

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.DEPLOY_API_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test --workspace server
      - run: npm run build --workspace server

      # Self-contained bundle: compiled JS + a fresh prod-only install.
      # All server deps are pure JS, so a lockfile-less install is fine here.
      - name: Assemble deploy bundle
        run: |
          mkdir -p bundle/dist
          cp -r server/dist/. bundle/dist/
          cp server/package.json bundle/package.json
          cd bundle && npm install --omit=dev --no-audit --no-fund --no-package-lock

      - name: Clean remote dist
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: rm -rf "${{ secrets.HOSTINGER_APP_PATH }}/dist"

      - name: Upload bundle
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -azr --exclude='.env' --exclude='.env.local' --exclude='data' --exclude='tmp'
          path: bundle/
          remote_path: ${{ secrets.HOSTINGER_APP_PATH }}
          remote_host: ${{ secrets.HOSTINGER_SSH_HOST }}
          remote_user: ${{ secrets.HOSTINGER_SSH_USER }}
          remote_port: ${{ secrets.HOSTINGER_SSH_PORT }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Restart Passenger
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            mkdir -p "${{ secrets.HOSTINGER_APP_PATH }}/tmp" "${{ secrets.HOSTINGER_APP_PATH }}/data"
            touch "${{ secrets.HOSTINGER_APP_PATH }}/tmp/restart.txt"
